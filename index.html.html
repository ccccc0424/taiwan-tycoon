const KEY='taiwan_economy_builder_v1';let state;let selected=null;let modalOpen=false;
function initial(){return {stage:0,turn:1,cash:500,food:0,industry:0,tech:0,happy:30,products:0,exports:0,map:Array(36).fill(null),answered:[[],[],[],[]],decisionDone:[false,false,false,false],logs:['歡迎來到臺灣經濟建設大亨！先選擇建築並點擊地圖。'],finished:false,score:0,wrong:0,rescues:0,stageAwarded:[false,false,false,false],decisionScores:[0,0,0,0],quizAttempts:{}}}

state=load();state.score??=0;state.wrong??=0;state.rescues??=0;state.stageAwarded??=[false,false,false,false];state.decisionScores??=[0,0,0,0];state.quizAttempts??={};function save(silent=false){try{localStorage.setItem(KEY,JSON.stringify(state));if(!silent)log('💾 進度已儲存在此瀏覽器。')}catch(e){if(!silent)log('⚠️ 無法儲存：瀏覽器可能限制本機儲存。')}}function log(t){state.logs.unshift(t);state.logs=state.logs.slice(0,12);renderLogs()}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function getBuildings(){return DATA[state.stage].buildings}function owned(id){return state.map.filter(x=>x?.id===id)}function count(id){return owned(id).length}function costOf(b){return b[3]}function nextQuestion(){return DATA[state.stage].questions.findIndex((q,i)=>!state.answered[state.stage].includes(i))}
function stageDone(){const s=state.stage,qs=state.answered[s].length===5&&state.decisionDone[s];if(!qs)return false;if(s===0)return state.food>=100&&state.cash>=300;if(s===1)return state.exports>=3&&state.cash>=200;if(s===2)return new Set(state.map.filter(Boolean).map(x=>x.id)).size>=3&&state.industry>=100;return state.tech>=120&&state.happy>=30}
function percent(){let s=state.stage;let q=state.answered[s].length/5*45+(state.decisionDone[s]?15:0);let r=s===0?Math.min(1,state.food/100)*20+Math.min(1,state.cash/300)*20:s===1?Math.min(1,state.exports/3)*25+Math.min(1,state.cash/200)*15:s===2?Math.min(1,new Set(state.map.filter(Boolean).map(x=>x.id)).size/3)*20+Math.min(1,state.industry/100)*20:Math.min(1,state.tech/120)*25+Math.min(1,state.happy/30)*15;return Math.round(q+r)}
function renderLogs(){document.getElementById('logs').innerHTML=state.logs.map(t=>'<p>'+esc(t)+'</p>').join('')}
function render(){document.getElementById('scorePanel').innerHTML=`<div style="font-size:28px;font-weight:800;color:#145b73">${state.score} 分</div><p class="muted">知識題每題首次答對＋30分（答錯後答對＋15分）；經營決策最佳選擇＋50分，其他選擇＋10分；每關通過＋50分；緊急打工每次－10分。滿分1000分。</p><p>答錯次數：${state.wrong}｜緊急打工：${state.rescues} 次</p>`;const d=DATA[state.stage];document.getElementById('stats').innerHTML=[['💰','金幣',state.cash],['🌾','糧食',state.food],['🏭','工業值',state.industry],['💻','科技值',state.tech],['😊','幸福值',state.happy],['🚢','出口批數',state.exports]].map(x=>`<div class="stat"><span>${x[0]} ${x[1]}</span><strong>${x[2]}</strong></div>`).join('');document.getElementById('stageTag').textContent=`第 ${state.stage+1} 關｜${d.era}`;document.getElementById('stageTitle').textContent=d.title;document.getElementById('turnTag').textContent=`第 ${state.turn} 回合`;document.getElementById('goal').textContent='🎯 '+d.goal;document.getElementById('history').textContent=d.history;document.getElementById('map').innerHTML=state.map.map((v,i)=>{const b=v&&getBuildings().find(x=>x[0]===v.id);return `<button class="tile" data-i="${i}" aria-label="${b?esc(b[2])+' 等級'+v.level:'空地 '+(i+1)}"><span class="emoji">${b?b[1]:'🌱'}</span><small>${b?esc(b[2]):'空地'}</small>${v?`<span class="level">Lv.${v.level}</span>`:''}</button>`}).join('');document.querySelectorAll('.tile').forEach(el=>el.addEventListener('click',()=>clickTile(Number(el.dataset.i))));document.getElementById('tools').innerHTML=getBuildings().map((b,i)=>{const unlocked=state.answered[state.stage].length>=i;return `<button class="tool ${selected===b[0]?'active':''}" data-id="${b[0]}" ${unlocked?'':'disabled'}><b>${b[1]} ${esc(b[2])}</b><small>${unlocked?'💰 '+b[3]+'｜'+esc(b[4]):'🔒 答對 '+i+' 題後解鎖'}</small></button>`}).join('');document.querySelectorAll('.tool').forEach(el=>el.addEventListener('click',()=>{selected=el.dataset.id;render()}));document.getElementById('progressBar').style.width=percent()+'%';document.getElementById('progressText').textContent=`完成度 ${percent()}%｜已答對 ${state.answered[state.stage].length}/5 題｜決策 ${state.decisionDone[state.stage]?'已完成':'未完成'}`;document.getElementById('questionProgress').innerHTML=state.answered[state.stage].map(()=> '⭐').join('')+Array(5-state.answered[state.stage].length).fill('☆').join('');const done=stageDone();document.getElementById('nextStageBtn').disabled=!done||state.finished;document.getElementById('nextStageBtn').textContent=state.stage===3?'🏆 查看最終成果':'🔓 前往下一年代';renderLogs();save(true)}
function clickTile(i){const tile=state.map[i];if(tile){const b=getBuildings().find(x=>x[0]===tile.id);let c=Math.ceil(b[3]*.7*tile.level);showModal(`<h2>${b[1]} ${esc(b[2])}｜Lv.${tile.level}</h2><p>${esc(b[4])}</p><p>升級費用：💰 ${c}（產量依等級增加）</p><div class="actions"><button class="btn" id="upgrade">升級建築</button><button class="btn secondary" id="closeModal">返回</button></div>`);document.getElementById('upgrade').onclick=()=>{if(state.cash<c){log('金幣不足，無法升級。');closeModal();return}state.cash-=c;tile.level++;log('⬆️ '+b[2]+'升級到 Lv.'+tile.level);closeModal();render()};document.getElementById('closeModal').onclick=closeModal;return}if(!selected){log('請先從建造工具箱選擇建築。');return}const b=getBuildings().find(x=>x[0]===selected);if(!b)return;if(state.cash<b[3]){log('💰 金幣不足！可以透過市場生產或答題取得獎勵。');return}state.cash-=b[3];state.map[i]={id:b[0],level:1};log('🏗️ 建造完成：'+b[2]+'（花費 '+b[3]+' 金幣）');render()}
function showModal(html){modalOpen=true;document.getElementById('modalHost').innerHTML=`<div class="modal-back"><section class="modal" role="dialog" aria-modal="true">${html}</section></div>`}function closeModal(){modalOpen=false;document.getElementById('modalHost').innerHTML=''}
function quiz(){let i=nextQuestion();if(i<0){showModal('<h2>🌟 本關知識挑戰全部完成！</h2><p>請繼續完成經營目標與決策任務。</p><button class="btn" id="ok">繼續經營</button>');document.getElementById('ok').onclick=closeModal;return}const q=DATA[state.stage].questions[i];showModal(`<span class="pill">第 ${i+1}/5 題｜${DATA[state.stage].title}</span><h2 style="line-height:1.5">${esc(q[0])}</h2><div class="choices">${q[1].map((c,j)=>`<button class="choice" data-answer="${j}">${'ABCD'[j]}. ${esc(c)}</button>`).join('')}</div><p class="muted">答對獲得80金幣並解鎖建築；答錯可查看提示再試一次。</p><button class="btn secondary" id="closeModal">稍後再答</button>`);document.querySelectorAll('[data-answer]').forEach(el=>el.onclick=()=>{const j=Number(el.dataset.answer);if(j===q[2]){state.answered[state.stage].push(i);state.cash+=80;const firstTry=!state.quizAttempts[state.stage+'-'+i];state.score+=firstTry?30:15;log('🎉 答對！＋80金幣。'+q[3]);showModal(`<h2>🎉 回答正確！</h2><p>${esc(q[3])}</p><p>獎勵：💰 80金幣，知識分數＋${firstTry?30:15}分，建築解鎖進度提升。</p><button class="btn" id="ok">回到城市</button>`);document.getElementById('ok').onclick=()=>{closeModal();render()};render()}else{state.wrong++;state.quizAttempts[state.stage+'-'+i]=true;save(true);showModal(`<h2>🔎 再想一想！</h2><p>${esc(q[3])}</p><p>這題不扣分，可以再試一次。</p><button class="btn" id="retry">重新挑戰</button>`);document.getElementById('retry').onclick=quiz}});document.getElementById('closeModal').onclick=closeModal}
function decision(){if(state.decisionDone[state.stage]){showModal('<h2>📜 本關決策已完成</h2><p>你已經處理過這個年代的經營事件。</p><button class="btn" id="ok">返回</button>');document.getElementById('ok').onclick=closeModal;return}const d=DATA[state.stage].decision;showModal(`<span class="pill">經營決策</span><h2>${esc(d.text)}</h2><p>不同選擇會改變城市資源。請先思考當時最需要解決的問題。</p><div class="choices">${d.options.map((o,i)=>`<button class="choice" data-decision="${i}">${esc(o[0])}</button>`).join('')}</div><button class="btn secondary" id="closeModal">稍後再決定</button>`);document.querySelectorAll('[data-decision]').forEach(el=>el.onclick=()=>{const optionIndex=Number(el.dataset.decision);const o=d.options[optionIndex];if(state.cash+o[1]<0){log('金幣不足，先透過生產或知識挑戰累積資金。');closeModal();return}state.cash+=o[1];state.happy=Math.max(0,state.happy+o[2]);state.food=Math.max(0,state.food+o[3]);state.exports+=o[4];state.tech=Math.max(0,state.tech+o[5]);state.decisionDone[state.stage]=true;const decisionPoints=optionIndex===0?50:10;state.score+=decisionPoints;state.decisionScores[state.stage]=decisionPoints;log('📜 決策結果：'+o[6]);showModal(`<h2>📜 決策結果</h2><p>${esc(o[6])}</p><p>本次決策得分：＋${decisionPoints}分</p><p class="muted">你可以繼續建造，調整城市的發展方向。</p><button class="btn" id="ok">繼續經營</button>`);document.getElementById('ok').onclick=()=>{closeModal();render()};render()});document.getElementById('closeModal').onclick=closeModal}
function advance(){const s=state.stage;let inc={cash:0,food:0,industry:0,tech:0,happy:0};for(const t of state.map){if(!t)continue;let lv=t.level;if(s===0){if(t.id==='farm')inc.food+=25*lv;if(t.id==='market')inc.cash+=70*lv;if(t.id==='home')inc.happy+=10*lv}else if(s===1){if(t.id==='house')inc.happy+=10*lv}else if(s===2){if(t.id==='highway')inc.industry+=15*lv;if(t.id==='steel'||t.id==='ship')inc.industry+=25*lv;if(t.id==='power')inc.industry+=20*lv}else{if(t.id==='lab')inc.tech+=25*lv;if(t.id==='park')inc.tech+=30*lv;if(t.id==='chip')inc.tech+=35*lv;if(t.id==='talent'){inc.tech+=15*lv;inc.happy+=10*lv}}}if(s===0){const bonus=count('water')*10;const farms=owned('farm').reduce((sum,t)=>sum+t.level,0);inc.food+=bonus*farms}if(s===1){const factories=owned('factory').reduce((sum,t)=>sum+t.level,0);state.products+=factories;if(count('port')&&count('road')&&state.products){const shipped=Math.min(state.products,Math.max(1,count('port')*2));state.products-=shipped;state.exports+=shipped;inc.cash+=shipped*120;log('🚢 出口 '+shipped+' 批商品，賺取 '+(shipped*120)+' 金幣。')}else if(factories)log('📦 產品已生產，但需要道路與港口才能出口。')}for(const k of Object.keys(inc))state[k]+=inc[k];state.turn++;log('⏩ 回合結束：'+Object.entries(inc).filter(([k,v])=>v>0).map(([k,v])=>({cash:'金幣',food:'糧食',industry:'工業值',tech:'科技值',happy:'幸福值'}[k]+' +'+v)).join('、')+(Object.values(inc).some(v=>v)?'':'尚無產出'));if(state.turn%5===0)log('💡 提醒：除了建造，別忘了完成知識挑戰與經營決策。');render();if(stageDone())log('🏆 本關目標達成！請點選「前往下一年代」。')}
function nextStage(){if(!stageDone())return;if(!state.stageAwarded[state.stage]){state.score+=50;state.stageAwarded[state.stage]=true;}if(state.stage===3){state.finished=true;save(true);showModal(`<h2>🏆 恭喜完成臺灣經濟建設大亨！</h2><div class="endcard"><p>你走過農業改革、加工出口區、十大建設與科技產業四個年代！</p><p style="font-size:32px;font-weight:800">🏅 總分：${state.score} / 1000 分</p><p>📚 知識挑戰：20 / 20 題完成</p><p>答錯 ${state.wrong} 次｜緊急打工 ${state.rescues} 次</p><p>請記下自己的分數，和同學比較！</p><p>📜 經營決策：4 / 4 次完成</p><p>💰 最終資金：${state.cash}｜😊 幸福值：${state.happy}</p></div><p>思考題：你認為臺灣發展過程中，哪一項建設最重要？為什麼？發展產業時還要注意哪些問題？</p><button class="btn" id="ok">查看我的城市</button>`);document.getElementById('ok').onclick=closeModal;render();return}state.stage++;state.turn=1;state.cash=Math.max(500,state.cash);state.food=0;state.industry=0;state.tech=0;state.products=0;state.exports=0;state.map=Array(36).fill(null);selected=null;log('🕰️ 進入'+DATA[state.stage].era+'：'+DATA[state.stage].title+'！新地圖已開放，保留累積資金與幸福值。');render();showModal(`<h2>🕰️ 歡迎來到${DATA[state.stage].era}</h2><p>${esc(DATA[state.stage].history)}</p><p><b>本關目標：</b>${esc(DATA[state.stage].goal)}</p><button class="btn" id="ok">開始建設</button>`);document.getElementById('ok').onclick=closeModal}
function help(){showModal(`<h2>📖 遊戲玩法</h2><ol style="line-height:1.9"><li>從右方選擇已解鎖建築，再點選地圖空地建造。</li><li>點選已建造的建築，可以花金幣升級，提高產量。</li><li>按「下一回合」取得糧食、金幣、工業值或科技值。</li><li>完成每關5道知識題，每答對一題可獲80金幣。</li><li>沒金幣時可按「緊急打工」，每次領100金幣，總分扣10分（不會低於0分）。</li><li>總分最高1000分：知識600、決策200、通關200。首次答對得分較高。</li><li>完成1次經營決策，了解不同政策的影響。</li><li>達成關卡目標後前往下一年代，共有4關、20題。</li></ol><p class="muted">第一關建議先蓋農田與市場；第二關需要工廠、道路和港口才能出口。進度會自動儲存於本機瀏覽器。</p><button class="btn" id="ok">開始遊戲</button>`);document.getElementById('ok').onclick=closeModal}
document.getElementById('earnBtn').onclick=()=>{showModal('<h2>🪙 緊急打工</h2><p>沒有金幣也不會卡關！可以領取100金幣繼續建設，但為了公平比較成績，總分扣10分（最低0分）。</p><div class="actions"><button class="btn" id="takeEarn">領取100金幣</button><button class="btn secondary" id="cancelEarn">取消</button></div>');document.getElementById('takeEarn').onclick=()=>{state.cash+=100;state.rescues++;state.score=Math.max(0,state.score-10);log('🪙 緊急打工：金幣＋100，總分－10。');closeModal();render()};document.getElementById('cancelEarn').onclick=closeModal};document.getElementById('turnBtn').onclick=advance;document.getElementById('challengeBtn').onclick=quiz;document.getElementById('decisionBtn').onclick=decision;document.getElementById('nextStageBtn').onclick=nextStage;document.getElementById('helpBtn').onclick=help;document.getElementById('saveBtn').onclick=()=>save(false);document.getElementById('resetBtn').onclick=()=>{showModal('<h2>確定要重新開始嗎？</h2><p>這會清除本機目前的遊戲進度，重新從第一關開始。</p><div class="actions"><button class="btn danger" id="confirmReset">確定重玩</button><button class="btn secondary" id="closeModal">取消</button></div>');document.getElementById('confirmReset').onclick=()=>{state=initial();selected=null;closeModal();render();help()};document.getElementById('closeModal').onclick=closeModal};render();if(state.turn===1&&state.stage===0&&state.answered[0].length===0&&state.map.every(x=>!x))help();
</script></body></html>
